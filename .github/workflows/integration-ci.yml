name: Integration CI

on:
  pull_request:
    branches:
      - stage2/planning-scenario-foundation
  push:
    branches:
      - integration/stage2-status-gis-footprint

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Stage 1 GIS tests
        id: stage1
        continue-on-error: true
        run: |
          pnpm exec vitest run \
            src/tests/vworld-buildings.test.ts \
            src/tests/status-insights.test.ts \
            src/tests/geo/normalize-road-lines.test.ts \
            --reporter=verbose > stage1-tests.log 2>&1

      - name: Upload Stage 1 test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-tests-log
          path: stage1-tests.log
          if-no-files-found: error

      - name: Stop after Stage 1 failure
        if: steps.stage1.outcome == 'failure'
        run: exit 1

      - name: Run Stage 2 planning tests
        run: |
          pnpm exec vitest run \
            src/tests/planning-scenarios.test.ts \
            src/tests/planning-calculator.test.ts \
            src/tests/planning-scenario-factory.test.ts \
            --reporter=verbose

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build
