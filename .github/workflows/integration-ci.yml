name: Integration CI

on:
  pull_request:
    branches:
      - stage2/recommendation-engine

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable >/dev/null 2>&1
          corepack prepare pnpm@9 --activate >/dev/null 2>&1
      - name: Install quietly
        run: pnpm install --frozen-lockfile --silent
      - name: Run recommendation tests to file
        id: tests
        shell: bash
        run: |
          set +e
          pnpm exec vitest run \
            src/tests/planning-recommendation-engine.test.ts \
            src/tests/planning-recommendation-analysis.test.ts \
            src/tests/planning-stepped-maximum-candidate.test.ts \
            --reporter=verbose > recommendation-test.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload recommendation test log
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-test-log
          path: recommendation-test.log
      - name: Fail when tests failed
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
