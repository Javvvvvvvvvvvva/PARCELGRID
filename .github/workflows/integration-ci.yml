name: Integration CI

on:
  pull_request:
    branches:
      - stage2/planning-scenario-foundation
      - integration/stage2-status-gis-footprint
      - stage2/envelope-data-bridge
      - stage2/planning-geometry-contract
      - stage2/sketchup-dae-export
      - stage2/cadastral-road-context
  push:
    branches:
      - integration/stage2-status-gis-footprint
      - stage2/envelope-data-bridge
      - stage2/planning-geometry-contract
      - stage2/sketchup-dae-export
      - stage2/cadastral-road-context
      - stage2/upis-road-boundaries

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Stage 1 GIS tests
        run: |
          pnpm exec vitest run \
            src/tests/vworld-buildings.test.ts \
            src/tests/status-insights.test.ts \
            src/tests/geo/normalize-road-lines.test.ts \
            src/tests/geo/select-primary-road.test.ts \
            src/tests/geo/orientation-display.test.ts \
            src/tests/geo/scene-extrusion.test.ts \
            --reporter=verbose

      - name: Run Stage 2 planning tests
        run: |
          pnpm exec vitest run \
            src/tests/planning-scenarios.test.ts \
            src/tests/planning-calculator.test.ts \
            src/tests/planning-scenario-factory.test.ts \
            src/tests/planning-scenario-finance-bridge.test.ts \
            src/tests/planning-geometry.test.ts \
            src/tests/planning-sketchup-export-package.test.ts \
            src/tests/planning-sketchup-dae-export.test.ts \
            src/tests/planning-cadastral-road-context.test.ts \
            src/tests/planning-upis-road-boundaries.test.ts \
            --reporter=verbose

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build
